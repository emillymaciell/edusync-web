<button
  type="button"
  class="theme-toggle"
  (click)="toggle()"
  [attr.aria-pressed]="isDark()"
  [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
  [title]="isDark() ? 'Tema claro' : 'Tema escuro'"
>
  <app-icon [name]="isDark() ? 'sun' : 'moon'" [size]="17" />
</button>
